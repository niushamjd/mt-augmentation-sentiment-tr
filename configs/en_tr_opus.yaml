############## EN->TR translation model for synthetic sentiment data ##############
#  Corpus: OPUS OpenSubtitles v2018 (en-tr), filtered/capped/split locally by
#  src/prepare_mt_corpus.py -> data/mt/opus_en_tr/{train,dev,test}.{en,tr}.
#  See that script's docstring for the filtering pipeline and source choice.
#  Uses dataset_type "plain" (local Moses-format files), not the huggingface
#  loader -- our filtering (length ratio, langid, dedup) isn't something
#  JoeyNMT's HF wrapper can express, so it's done upstream and these files
#  are the final product.
#
#  All commands below are run from inside the (untracked, locally-cloned)
#  `joeynmt/` directory, pointing back at this repo's config/data with `../`:
#
#  Corpus + vocab are already built (see src/prepare_mt_corpus.py and
#  src/build_mt_vocab.py at the repo root). To rebuild from scratch:
#   $ python src/prepare_mt_corpus.py --en <raw.en> --tr <raw.tr> --max-raw-lines 1500000
#   $ python src/build_mt_vocab.py
#
#  Train:
#   $ python -m joeynmt train ../configs/en_tr_opus.yaml
#
#  mt_early / mt_final (Section 3.3): JoeyNMT only writes a checkpoint file
#  when a validation run beats the previous best, so an arbitrary "25% of
#  training" checkpoint is NOT guaranteed to survive by default.
#  keep_best_ckpts is set to -1 (keep every best-so-far checkpoint, never
#  prune) specifically so this is possible -- once training finishes, look
#  through model_dir for the checkpoint whose step count is closest to 25%
#  of the final step count and copy it out as mt_early; copy best.ckpt as
#  mt_final. This is a manual step, do it deliberately, don't skip it.
name: "en_tr_opus"
joeynmt_version: "2.3.0"
model_dir: "../models/en_tr_opus"
use_cuda: False    # CPU-only on this team's laptops (no MPS support in JoeyNMT/torch 2.1.2)
fp16: False
random_seed: 42

data:
    train: "../data/mt/opus_en_tr/train"
    dev: "../data/mt/opus_en_tr/dev"
    test: "../data/mt/opus_en_tr/test"
    dataset_type: "plain"
    src:
        lang: "en"
        max_length: 100
        lowercase: True
        normalize: False
        level: "bpe"
        voc_limit: 8000
        voc_min_freq: 1
        voc_file: "../data/mt/opus_en_tr/sp.vocab"
        tokenizer_type: "sentencepiece"
        tokenizer_cfg:
            model_file: "../data/mt/opus_en_tr/sp.model"
            model_type: "bpe"
            character_coverage: 1.0
            alpha: 0.1
            pretokenizer: "moses"
    trg:
        lang: "tr"
        max_length: 100
        lowercase: True
        normalize: False
        level: "bpe"
        voc_limit: 8000
        voc_min_freq: 1
        voc_file: "../data/mt/opus_en_tr/sp.vocab"
        tokenizer_type: "sentencepiece"
        tokenizer_cfg:
            model_file: "../data/mt/opus_en_tr/sp.model"
            model_type: "bpe"
            character_coverage: 1.0
            alpha: 0.1
            pretokenizer: "moses"
    special_symbols:
        unk_token: "<unk>"
        unk_id: 0
        pad_token: "<pad>"
        pad_id: 1
        bos_token: "<s>"
        bos_id: 2
        eos_token: "</s>"
        eos_id: 3

testing:
    n_best: 1
    beam_size: 5
    beam_alpha: 1.0
    batch_size: 32
    batch_type: "sentence"
    max_output_length: 100
    eval_metrics: ["bleu", "chrf"]
    sacrebleu_cfg:
        tokenize: "13a"
        lowercase: True

training:
    optimizer: "adamw"
    normalization: "tokens"
    adam_betas: [0.9, 0.999]
    scheduling: "warmupinversesquareroot"
    learning_rate_warmup: 2000
    learning_rate: 0.0002
    learning_rate_min: 0.00000001
    weight_decay: 0.0
    label_smoothing: 0.1
    loss: "crossentropy"
    batch_size: 4096
    batch_type: "token"
    batch_multiplier: 2
    early_stopping_metric: "bleu"
    epochs: 30              # starting point -- tune down/up once you see per-epoch time on CPU
    validation_freq: 1000
    logging_freq: 100
    overwrite: False
    shuffle: True
    print_valid_sents: [0, 1, 2, 3]
    keep_best_ckpts: -1     # keep every best-so-far checkpoint -- needed to recover an mt_early snapshot, see note above

model:
    initializer: "xavier_uniform"
    bias_initializer: "zeros"
    init_gain: 1.0
    embed_initializer: "xavier_uniform"
    embed_init_gain: 1.0
    tied_embeddings: True
    tied_softmax: True
    encoder:
        type: "transformer"
        num_layers: 4
        num_heads: 8
        embeddings:
            embedding_dim: 512
            scale: True
            dropout: 0.
        hidden_size: 512
        ff_size: 1024
        dropout: 0.1
        layer_norm: "pre"
        activation: "relu"
    decoder:
        type: "transformer"
        num_layers: 4
        num_heads: 8
        embeddings:
            embedding_dim: 512
            scale: True
            dropout: 0.
        hidden_size: 512
        ff_size: 1024
        dropout: 0.1
        layer_norm: "pre"
        activation: "relu"
